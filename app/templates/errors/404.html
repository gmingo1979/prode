{% extends "base.html" %}
{% block content %}

<div style="max-width:520px; margin:4rem auto; text-align:center;">

  <div style="font-size:5rem; font-weight:800; color:#e8ecf0; line-height:1; margin-bottom:0.5rem;">
    404
  </div>

  <h1 style="font-size:1.1rem; font-weight:600; color:#1a1a2e; margin-bottom:0.5rem;">
    Página no encontrada
  </h1>

  <p style="font-size:0.85rem; color:#888; margin-bottom:2rem;">
    La dirección que ingresaste no existe o fue movida.
  </p>

  {% if endpoint %}
  <div class="card border-0 shadow-sm text-start mb-3">
    <div class="card-body py-3" style="font-size:0.83rem;">
      <div class="row g-2">
        <div class="col-4" style="color:#aaa;">URL</div>
        <div class="col-8">
          <code style="font-size:0.82rem; background:#f4f6f9;
                       padding:0.15em 0.45em; border-radius:4px; color:#555;">
            {{ endpoint }}
          </code>
        </div>
      </div>
    </div>
  </div>
  {% endif %}

  <div class="d-flex gap-2 justify-content-center">
    <a href="{{ url_for('main_bp.index') }}" class="btn btn-sm btn-primary-app">
      <i class="bi bi-house me-1"></i>Ir al inicio
    </a>
    <button onclick="history.back()" class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-arrow-left me-1"></i>Volver
    </button>
  </div>

</div>

{% endblock %}
