{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div><h1 class="page-title">{{ titulo }}</h1></div>
  <a href="{{ url_for('prode_bp.admin_torneo_editar', id=torneo.id) }}"
     class="btn btn-sm btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>Volver a {{ torneo.nombre }}
  </a>
</div>

<div class="card border-0 shadow-sm" style="max-width:480px;">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label form-label-sm">Nombre de la fase <span class="text-danger">*</span></label>
        <input type="text" name="nombre" class="form-control form-control-sm"
               value="{{ fase.nombre if fase }}"
               placeholder="Ej: Fase de Grupos, Octavos de Final..." required>
      </div>
      <div class="mb-3">
        <label class="form-label form-label-sm">Orden</label>
        <input type="number" name="orden" class="form-control form-control-sm"
               value="{{ fase.orden if fase else 0 }}" min="0">
        <div class="form-text">Número para ordenar fases cronológicamente (menor = primero).</div>
      </div>
      <div class="text-end">
        <button type="submit" class="btn btn-sm btn-primary-app">
          <i class="bi bi-floppy me-1"></i>Guardar
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
