{% extends "base.html" %}
{% block content %}

<div class="page-header">
  <div>
    <h1 class="page-title">Crear grupo</h1>
    <p class="page-subtitle">Tu grupo tendrá un código único para que otros puedan unirse.</p>
  </div>
  <a href="{{ url_for('grupos_bp.mis_grupos') }}" class="btn btn-sm btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>Volver
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-5">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="POST">

          <div class="mb-3">
            <label class="form-label form-label-sm fw-semibold">
              Nombre del grupo <span class="text-danger">*</span>
            </label>
            <input type="text" name="nombre" class="form-control form-control-sm"
                   placeholder="Ej: Familia Martínez, Oficina piso 3…"
                   maxlength="80" required autofocus>
          </div>

          <div class="mb-4">
            <label class="form-label form-label-sm fw-semibold">Descripción (opcional)</label>
            <input type="text" name="descripcion" class="form-control form-control-sm"
                   placeholder="Una frase sobre el grupo…" maxlength="200">
          </div>

          <div class="alert alert-info py-2 px-3 mb-4" style="font-size:0.82rem;">
            <i class="bi bi-info-circle me-1"></i>
            Al crear el grupo vas a recibir un código de 8 caracteres para compartir con tus amigos.
          </div>

          <button type="submit" class="btn btn-primary-app w-100">
            <i class="bi bi-check2 me-1"></i>Crear grupo
          </button>

        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
