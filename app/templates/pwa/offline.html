<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin conexión — Pronósticos Deportivos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:#003263;color:white;
         min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
    .card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
          border-radius:16px;padding:3rem 2.5rem;max-width:380px;width:100%;text-align:center}
    .icon{font-size:3.5rem;opacity:.6;margin-bottom:1.5rem;display:block}
    h1{font-size:1.3rem;font-weight:600;margin-bottom:.75rem}
    p{font-size:.88rem;opacity:.7;line-height:1.6;margin-bottom:2rem}
    button{background:white;color:#003263;border:none;border-radius:8px;padding:.7rem 2rem;
           font-size:.9rem;font-weight:600;cursor:pointer;width:100%;transition:opacity .15s}
    button:hover{opacity:.9}
    .version{margin-top:2rem;font-size:.7rem;opacity:.3}
  </style>
</head>
<body>
  <div class="card">
    <i class="bi bi-wifi-off icon"></i>
    <h1>Sin conexión</h1>
    <p>No hay conexión a internet en este momento.<br>Verificá tu red e intentá de nuevo.</p>
    <button onclick="window.location.reload()">
      <i class="bi bi-arrow-clockwise"></i> Reintentar
    </button>
    <div class="version">Pronósticos Deportivos — modo offline</div>
  </div>
</body>
</html>
