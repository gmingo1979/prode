services:
  - type: web
    name: prode
    runtime: python
    buildCommand: pip install --prefer-binary -r requirements.txt && mkdir -p /opt/render/project/data && flask db upgrade
    startCommand: gunicorn "run:flask_app" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false          # completar en el dashboard con la URL de Render
      - key: NOMBRE_EMPRESA
        value: Prode
      - key: NOMBRE_APLICACION
        value: Prode
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: DB_PATH
        value: /opt/render/project/data/prode.db
